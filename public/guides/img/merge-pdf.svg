<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">PDF Suite merge workspace diagram</title>
  <rect width="960" height="540" fill="#F6FAFC"/>
  <rect x="32" y="28" width="896" height="484" rx="28" fill="#fff" stroke="#e2e8f0"/>
  <rect x="32" y="28" width="8" height="484" rx="4" fill="#00A3AD"/>
  <text x="64" y="72" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#0A2540">PDF Suite</text>
  <text x="64" y="98" font-family="system-ui,sans-serif" font-size="13" fill="#007A82">Merge · rotate · split · watermark · in this tab</text>
  <rect x="64" y="124" width="520" height="220" rx="20" fill="#F4F8FA" stroke="#B3EAEF" stroke-dasharray="6 6"/>
  <text x="324" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#007A82">Drop PDF documents here</text>
  <text x="324" y="252" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748B">pdf-lib reads files in this browser tab</text>
  <rect x="64" y="364" width="240" height="88" rx="16" fill="#fff" stroke="#e2e8f0"/>
  <text x="84" y="400" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0A2540">cover.pdf</text>
  <text x="84" y="422" font-family="ui-monospace,monospace" font-size="11" fill="#64748B">2 pages · order #1</text>
  <rect x="320" y="364" width="240" height="88" rx="16" fill="#fff" stroke="#e2e8f0"/>
  <text x="340" y="400" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0A2540">appendix.pdf</text>
  <text x="340" y="422" font-family="ui-monospace,monospace" font-size="11" fill="#64748B">6 pages · order #2</text>
  <rect x="620" y="124" width="270" height="328" rx="20" fill="#0A2540"/>
  <text x="644" y="164" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#00A3AD">EXPORT</text>
  <text x="644" y="200" font-family="system-ui,sans-serif" font-size="16" fill="#fff">Merge PDFs</text>
  <text x="644" y="230" font-family="system-ui,sans-serif" font-size="12" fill="#94A3B8">Copies pages into one file</text>
  <rect x="644" y="268" width="222" height="44" rx="22" fill="#00A3AD"/>
  <text x="755" y="296" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">Download merged.pdf</text>
  <text x="644" y="348" font-family="system-ui,sans-serif" font-size="11" fill="#94A3B8">Preview tiles are placeholders.</text>
  <text x="644" y="368" font-family="system-ui,sans-serif" font-size="11" fill="#94A3B8">Encrypted PDFs may fail.</text>
</svg>
