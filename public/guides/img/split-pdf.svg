<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">PDF split by page range diagram</title>
  <rect width="960" height="540" fill="#F6FAFC"/>
  <rect x="32" y="28" width="896" height="484" rx="28" fill="#fff" stroke="#e2e8f0"/>
  <text x="64" y="78" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#0A2540">Split / Range</text>
  <text x="64" y="106" font-family="system-ui,sans-serif" font-size="13" fill="#64748B">First loaded file · 1-based pages · example 1-3,5</text>
  <rect x="64" y="140" width="400" height="300" rx="20" fill="#F4F8FA" stroke="#e2e8f0"/>
  <text x="88" y="180" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0A2540">report.pdf · 12 pages</text>
  <g font-family="ui-monospace,monospace" font-size="12" fill="#0A2540">
    <rect x="88" y="208" width="48" height="56" rx="8" fill="#E6F8F9" stroke="#00A3AD"/><text x="104" y="242">1</text>
    <rect x="148" y="208" width="48" height="56" rx="8" fill="#E6F8F9" stroke="#00A3AD"/><text x="164" y="242">2</text>
    <rect x="208" y="208" width="48" height="56" rx="8" fill="#E6F8F9" stroke="#00A3AD"/><text x="224" y="242">3</text>
    <rect x="268" y="208" width="48" height="56" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="284" y="242">4</text>
    <rect x="328" y="208" width="48" height="56" rx="8" fill="#E6F8F9" stroke="#00A3AD"/><text x="344" y="242">5</text>
  </g>
  <text x="88" y="300" font-family="system-ui,sans-serif" font-size="12" fill="#007A82">Highlighted pages will be copied</text>
  <rect x="520" y="140" width="368" height="300" rx="20" fill="#fff" stroke="#B3EAEF"/>
  <text x="544" y="184" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#007A82">PAGE RANGE</text>
  <rect x="544" y="208" width="320" height="48" rx="12" fill="#F4F8FA" stroke="#00A3AD"/>
  <text x="564" y="238" font-family="ui-monospace,monospace" font-size="18" fill="#0A2540">1-3,5</text>
  <rect x="544" y="280" width="320" height="48" rx="24" fill="#00A3AD"/>
  <text x="704" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff">Download split-pages.pdf</text>
  <text x="544" y="360" font-family="system-ui,sans-serif" font-size="12" fill="#64748B">Original on disk is not rewritten.</text>
</svg>
