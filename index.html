<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FileTools Kit | Free PDF, image, and resume tools in your browser</title>
    <meta name="description" content="Merge PDFs, convert images, build a resume PDF, and more in this tab. Free tools operated by Souren Das in Bengaluru. No file-upload API." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://www.filetoolskit.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <meta name="theme-color" content="#EA580C" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4409273905876536" crossorigin="anonymous"></script>
    <style>
      html,body{margin:0;background:#FFF4E8;color:#0A2540;font-family:ui-sans-serif,system-ui,sans-serif}
      #boot{max-width:80rem;margin:0 auto;padding:5.5rem 1rem 1.5rem}
      #boot h1{margin:0;font-size:1.65rem;line-height:1.25;font-weight:800}
      #boot p{margin:0.85rem 0 0;max-width:36rem;font-size:0.95rem;line-height:1.55;color:#334155}
      #boot .pill{display:inline-block;margin:0 0 0.85rem;padding:0.35rem 0.75rem;border-radius:999px;background:#FFEDD5;border:1px solid #FDBA74;color:#9A3412;font-size:11px;font-weight:800}
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="pill">Free tools · files stay in this tab</div>
      <h1>Merge, convert, and export files without uploading them.</h1>
      <p>PDF merge and split, image convert, resume PDF, QR, SVG, hashes, and more. Work runs in this browser tab. Operated by Souren Das in Bengaluru.</p>
    </div>
    <script>
      (function () {
        var path = (location.pathname || '/').replace(/\/$/, '') || '/';
        var pages = {
          '/pdf-suite': ['PDF Suite — merge, split, rotate, and watermark in this tab', 'Reads PDFs with the File API and edits them with pdf-lib in this tab. Encrypted files often fail. A watermark is not encryption.'],
          '/resume-builder': ['Resume Builder — fill a form and download a PDF', 'Twelve layouts, jsPDF in this tab. Match percentage is local keyword overlap, not an ATS.'],
          '/file-converter': ['File Converter — change image formats in the browser', 'PNG, JPEG, or WebP via canvas. Not DOCX, video, or audio.'],
          '/image-optimizer': ['Image Optimizer — shrink photos before you send them', 'Resize and recompress in this tab. Keep the original. JPEG/WebP are usually lossy.'],
          '/qr-generator': ['QR Generator — encode a URL or line of text', 'Export PNG or SVG in this tab. No short-link hosted here.'],
          '/dev-tools': ['Dev Tools — hash and encode text locally', 'SHA-256 via Web Crypto in this tab. Base64 is not encryption.'],
          '/markdown-editor': ['Markdown Editor — write and preview in the tab', 'Preview Markdown locally. Refreshing can clear unsaved text.'],
          '/svg-editor': ['SVG Studio — edit simple vector markup locally', 'Tweak SVG markup in the browser. No photo auto-trace.'],
          '/text-diff': ['Text Diff — compare two strings side by side', 'Insertions and deletions in this tab. Refreshing clears the boxes.'],
          '/social-studio': ['Social Studio — resize a canvas for common post sizes', 'Export a PNG. This page does not post to any network.'],
          '/health-calc': ['Health calculator — numbers only, not medical advice', 'BMI here is arithmetic. See the disclaimer.'],
          '/currency-crypto': ['Currency worksheet — example rates, not a live feed', 'Static example figures. Not a bank quote.']
        };
        var row = pages[path];
        if (!row) return;
        var boot = document.getElementById('boot');
        if (!boot) return;
        boot.innerHTML = '<div class="pill">Free tools · files stay in this tab</div><h1>' + row[0] + '</h1><p>' + row[1] + '</p>';
      })();
    </script>
    <noscript>
      <p>JavaScript is required for the tools. Use <a href="/guides.html">Guides</a>, <a href="/about.html">About</a>, and <a href="/privacy.html">Privacy</a>.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
